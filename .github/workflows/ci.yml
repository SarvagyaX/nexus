name: NEXUS CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test_password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install flake8 pip-audit

      - name: Python Code Syntax & Linting (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity check and style inspection
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: "postgresql://nexus_test:nexus_test_password@localhost:5432/nexus_test"
        run: |
          cat <<'EOF' > .env
          APP_ENV=testing
          POSTGRES_URL=postgresql://nexus_test:nexus_test_password@localhost:5432/nexus_test
          EOF
          pytest backend/tests -v

      - name: Dependency Security Audit (pip-audit)
        run: |
          pip-audit --requirement backend/requirements.txt || echo "Warning - pip-audit reported issues. Review in security log."

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compiler Verification
        working-directory: frontend
        run: npx tsc -b

      - name: Vite Production Build
        working-directory: frontend
        run: npm run build

      - name: NPM Dependency Audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high || echo "Warning - npm audit reported non-blocking issues."

  docker-validate:
    name: Docker Configuration & Multi-stage Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Development Compose Configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          echo "docker-compose.yml validation passed."

      - name: Validate Production Compose Configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
          echo "docker-compose.prod.yml validation passed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry-Run Test)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nexus-backend:ci-test

      - name: Build Frontend Production Docker Image (Dry-Run Test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: nexus-frontend:ci-test
