name: nexus-prod

networks:
  nexus-frontend-net:
    driver: bridge
  nexus-backend-net:
    driver: bridge
  nexus-db-net:
    driver: bridge
    internal: true

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus-frontend-net
      - nexus-backend-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "true"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in production environment}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in production environment}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in production environment}
      DEMO_AUTH_ENABLED: "false"
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@nexus.local}
      DEFAULT_WEBHOOK_URL: ${DEFAULT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-backend-net
      - nexus-db-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in production environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in production environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production environment}
    networks:
      - nexus-db-net
    volumes:
      - nexus-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - nexus-db-net
    volumes:
      - nexus-redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

volumes:
  nexus-postgres-prod-data:
  nexus-redis-prod-data:
